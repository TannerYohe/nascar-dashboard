AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Race Rewind: the API on Lambda behind a function URL, and the UI on S3, both
  served through one CloudFront distribution. Deployed by infra/deploy.sh.

Parameters:
  ImageUri:
    Type: String
    Description: API image in ECR, by digest.
  ApiFunctionRoleArn:
    Type: String
    Description: Execution role for the API (bootstrap stack output).
  DsqlEndpoint:
    Type: String
    Description: Aurora DSQL cluster endpoint (bootstrap stack output).
  SiteBucketName:
    Type: String
    Description: Bucket holding the built UI (bootstrap stack output).
  SiteBucketDomainName:
    Type: String
    Description: Regional domain name of the site bucket (bootstrap stack output).
  ApiMemorySize:
    Type: Number
    Default: 1024
    Description: Lambda memory in MB. CPU scales with it.
  CertificateArn:
    Type: String
    Description: us-east-1 certificate covering both domains (domains stack output).
  PrimaryDomain:
    Type: String
    Description: Domain the site URL uses (domains stack output).
  PrimaryHostedZoneId:
    Type: String
    Description: Hosted zone of the primary domain (domains stack output).
  SecondaryDomain:
    Type: String
    Description: Second domain serving the site (domains stack output).
  SecondaryHostedZoneId:
    Type: String
    Description: Hosted zone of the secondary domain (domains stack output).

Mappings:
  CloudFront:
    Alias:
      # Fixed hosted zone ID that Route 53 alias records use for every CloudFront distribution.
      HostedZoneId: Z2FDTNDATAQYW2

Resources:
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/nascar-dashboard-api
      RetentionInDays: 14

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: nascar-dashboard-api
      Description: Race Rewind API (Litestar via Lambda Web Adapter)
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Role: !Ref ApiFunctionRoleArn
      Architectures:
        - arm64
      MemorySize: !Ref ApiMemorySize
      Timeout: 30
      Environment:
        Variables:
          DSQL_ENDPOINT: !Ref DsqlEndpoint
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup

  ApiFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ApiFunction.Arn
      AuthType: AWS_IAM

  # CloudFront signs requests to the function URL (origin access control), so
  # only this distribution can call it.
  ApiUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunctionUrl
      FunctionUrlAuthType: AWS_IAM
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      InvokedViaFunctionUrl: true
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucketName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${SiteBucketName}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: nascar-dashboard-site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ApiOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: nascar-dashboard-api
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  # Serves index.html for app routes like /replay/5551 so React Router can take
  # over. Paths with a file extension go to S3 unchanged.
  SpaRoutingFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: nascar-dashboard-spa-routing
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite extensionless paths to /index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var lastSegment = request.uri.substring(request.uri.lastIndexOf('/') + 1);
          if (lastSegment.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  # Caches API responses for as long as their Cache-Control header says, and
  # not at all when there isn't one.
  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: nascar-dashboard-api
        Comment: Honor the API's Cache-Control; key on the query string
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          QueryStringsConfig:
            QueryStringBehavior: all
          HeadersConfig:
            HeaderBehavior: none
          CookiesConfig:
            CookieBehavior: none

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Race Rewind
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases:
          - !Ref PrimaryDomain
          - !Sub www.${PrimaryDomain}
          - !Ref SecondaryDomain
          - !Sub www.${SecondaryDomain}
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !Ref SiteBucketDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !Select [2, !Split ["/", !GetAtt ApiFunctionUrl.FunctionUrl]]
            OriginAccessControlId: !GetAtt ApiOriginAccessControl.Id
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # Managed policies: CachingOptimized and SecurityHeadersPolicy.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRoutingFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: !Ref ApiCachePolicy
            # Managed policy AllViewerExceptHostHeader: the function URL needs its own Host.
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  PrimaryDomainRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref PrimaryHostedZoneId
      RecordSets:
        - Name: !Ref PrimaryDomain
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: !FindInMap [CloudFront, Alias, HostedZoneId]
        - Name: !Ref PrimaryDomain
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: !FindInMap [CloudFront, Alias, HostedZoneId]
        - Name: !Sub www.${PrimaryDomain}
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: !FindInMap [CloudFront, Alias, HostedZoneId]
        - Name: !Sub www.${PrimaryDomain}
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: !FindInMap [CloudFront, Alias, HostedZoneId]

  SecondaryDomainRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref SecondaryHostedZoneId
      RecordSets:
        - Name: !Ref SecondaryDomain
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: !FindInMap [CloudFront, Alias, HostedZoneId]
        - Name: !Ref SecondaryDomain
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: !FindInMap [CloudFront, Alias, HostedZoneId]
        - Name: !Sub www.${SecondaryDomain}
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: !FindInMap [CloudFront, Alias, HostedZoneId]
        - Name: !Sub www.${SecondaryDomain}
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: !FindInMap [CloudFront, Alias, HostedZoneId]

Outputs:
  SiteUrl:
    Value: !Sub https://${PrimaryDomain}
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Value: !Ref Distribution
  FunctionName:
    Value: !Ref ApiFunction
