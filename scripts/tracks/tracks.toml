# Tracks to build layouts for, keyed by the feed's track_id.
#
#   lat, lon   a point inside the venue; ways are searched within `radius` m.
#   variants   lap lengths (miles) raced here. One layout is built per length,
#              by picking the loop of OSM raceway ways closest to it. The replay
#              uses the variant closest to a race's distance / laps.
#   road       true for road and street courses. Anything else is an oval, and
#              the builder prefers the roundest loop of the right length.
#   direction  "ccw" (left turns: every oval) or "cw". Only used when the OSM
#              ways don't say (no oneway tags).
#   sf         optional [lat, lon] of the start/finish line. Without it, the
#              line goes beside the middle of pit road.
#
# Temporary street circuits, dirt tracks and the Coliseum aren't drawn in OSM
# as raceways; they're listed so the build reports them, and fall back to the
# generic oval in the app.

