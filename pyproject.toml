[build-system]
requires = ["setuptools>=75.8"]
build-backend = "setuptools.build_meta"

[project]
name = "nascar_dashboard"
version = "0.0.1"
authors = [
  { name="Tanner Yohe", email="tanneryohe95@gmail.com" },
]
description = "NASCAR dashboard and ETL pipeline for collecting and visualizing race data."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [

]
license = {text = "MIT"}

[project.urls]
Homepage = "https://github.com/TannerYohe/nascar-dashboard"
Issues = "https://github.com/TannerYohe/nascar-dashboard/issues"
